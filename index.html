<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Dashers</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="assets/style.css">
    <meta name="description" content="Web Dashers is a fan-made browser mod of the Geometry Dash Web Demo featuring main levels, level creator, and online level search.">
    <meta name="theme-color" content="#C1FB3D">

    <!-- - Embeds - -->
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web-dashers.github.io/" />
    <meta property="og:title" content="Web Dashers" />
    <meta property="og:description" content="Web Dashers is a fan-made browser mod of the Geometry Dash Web Demo featuring main levels, level creator, and online level search." />
    <meta property="og:image" content="https://web-dashers.github.io/wd_assets/thumbnail_1024.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://web-dashers.github.io/" />
    <meta property="twitter:title" content="Web Dashers" />
    <meta property="twitter:description" content="Web Dashers is a fan-made browser mod of the Geometry Dash Web Demo featuring main levels, level creator, and online level search." />
    <meta property="twitter:image" content="https://web-dashers.github.io/wd_assets/thumbnail_1024.png" />

    <!-- Libraries and stuff -->
    <script src="assets/scripts/game/allObjects.js?latest"></script>
    <script src="assets/scripts/game/allLevels.js"></script>
    <script src="assets/scripts/libs/phaser.min.js"></script>
    <script src="assets/scripts/libs/pako.min.js"></script>
    <script src="assets/scripts/utils/cache-manager.js"></script>
    <script src="assets/scripts/api/GDapiWrapper.js"></script>
    <script src="assets/scripts/utils/api-config.js"></script>
    <script src="assets/scripts/api/account-api.js?v=2.2.0"></script>
    <!-- Resilient Same-Origin GD API Router (No Cloudflare Workers, Pure HTTPS) -->
    <script>
        (function () {
            var localOrigin = (typeof window !== "undefined" && window.location && window.location.origin && !window.location.origin.startsWith("file:"))
                ? window.location.origin + "/api/gd"
                : "/api/gd";
            window._gdProxyUrl = localOrigin;
            window._gdProxyHosts = [localOrigin];
        })();
    </script>
    <script defer src="assets/scripts/utils/config.js"></script>
    <script defer src="assets/scripts/core/triggers.js?v=3.3.0"></script>
    <script defer src="assets/scripts/core/level.js?v=3.3.0"></script>
    <script defer src="assets/scripts/core/player.js?v=3.3.0"></script>
    <script defer src="assets/scripts/core/audio.js?v=3.3.0"></script>
    <script defer src="assets/scripts/core/loading-screen.js?v=3.3.0"></script>
    <script defer src="assets/scripts/core/level-editor.js?v=3.3.0"></script>
    <script defer src="assets/scripts/core/game-scene.js?v=3.3.0"></script>
    <script defer src="assets/scripts/utils/performance-optimizer.js?v=3.3.0"></script>
    <script defer src="assets/scripts/utils/graphics-manager.js"></script>
    <script defer src="assets/scripts/core/main.js?v=3.3.0"></script>
    <script>
        new ResizeObserver(() => {
            window.dispatchEvent(new Event('resize'));
        }).observe(document.documentElement);

        document.oncontextmenu = (event) => {
            event.preventDefault();
        };
    </script>
</head>
